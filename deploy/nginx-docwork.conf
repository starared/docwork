# 放到 /etc/nginx/sites-available/docwork.conf，并链接到 sites-enabled；把 doc.example.com 换成你的域名，
# 把 /srv/docwork 换成 .env 中的 DW_HOST_DATA。然后：sudo nginx -t && sudo systemctl reload nginx
# 最后签发证书：sudo certbot --nginx -d doc.example.com （Certbot 会自动添加 443 配置和跳转）

upstream docwork {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name doc.example.com;

    # 分片上传每片 5MB，这里留出余量；与后端的分片大小保持一致
    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # 用 $remote_addr 覆盖（而不是 $proxy_add_x_forwarded_for 追加），客户端自带的转发头不会被传给后端
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://docwork;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 上传分片：不在 Nginx 缓冲，直接流给后端
    location ^~ /api/uploads {
        proxy_pass http://docwork;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # 任务进度推送（SSE）：关闭响应缓冲，长超时；后端每 15 秒发送心跳
    location ~ ^/api/jobs/[^/]+/events$ {
        proxy_pass http://docwork;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    # 文件下载：后端鉴权后返回 X-Accel-Redirect，由 Nginx 直接发送文件（不经过 Python）。
    # 外部无法直接访问这个地址（internal）。
    location ~ ^/_protected/blobs/([0-9a-f]{2})/([0-9a-f]{2})/([0-9a-f]{64})/f\.([a-z0-9]{1,8})$ {
        internal;
        alias /srv/docwork/blobs/$1/$2/$3;
        add_header X-Content-Type-Options nosniff always;
    }
}

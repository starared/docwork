# DocWork 部署（单机）。所有容器共用 /data（宿主机目录 ${DW_HOST_DATA}）。
# 各容器的 mem_limit 是封顶值而不是常驻占用，默认合计 5248 MB，可在 .env 中按机器情况覆盖。
# - web：对外提供网页，监听 ${DW_BIND}:${DW_PORT}。
# - worker-ai：调用 OpenAI 兼容的模型接口，需要能访问该接口。
# - worker-heavy：渲染、转换、OCR、预览四个重负载队列共用一个容器。network_mode: none，完全没有网络；
#   根文件系统只读。同时运行的重负载任务数由配置档决定（standard 为 2），所以一个容器的封顶值
#   按“2 个外部程序 + worker 本身”设置即可，不必为四类任务各留一份峰值。
#   各容器只通过 /data 中的 SQLite 队列协作，全局并发由认领任务时的数据库事务保证。
x-app: &app
  image: docwork:latest
  env_file: .env
  volumes:
    - ${DW_HOST_DATA:-./data}:/data
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }
  stop_grace_period: 60s

x-heavy: &heavy
  <<: *app
  network_mode: none
  read_only: true
  tmpfs:
    - /tmp:size=256m
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]

services:
  web:
    <<: *app
    build: .
    ports:
      - "${DW_BIND:-0.0.0.0}:${DW_PORT:-8000}:8000"
    mem_limit: ${MEM_WEB:-1024m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker-ai:
    <<: *app
    command: ["python", "-m", "app.worker", "--queues", "ai"]
    # 模型接口在宿主机上时，地址写 http://host.docker.internal:端口/v1
    extra_hosts: ["host.docker.internal:host-gateway"]
    mem_limit: ${MEM_AI:-768m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [web]

  worker-heavy:
    <<: *heavy
    command: ["python", "-m", "app.worker", "--queues", "render,convert,ocr,preview"]
    mem_limit: ${MEM_HEAVY:-3072m}
    depends_on: [web]

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler"]
    mem_limit: ${MEM_SCHEDULER:-384m}
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on: [web]

name: 测试

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 单元与集成测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DW_SANDBOX: rlimit
      SAL_USE_VCLPLUGIN: svp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 与 Dockerfile 相同的系统组件（去掉部署才需要的 restic/tini 等）
      - name: 安装系统组件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-draw libreoffice-math \
            python3-uno \
            fonts-noto-cjk fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core fontconfig \
            ghostscript qpdf pandoc \
            tesseract-ocr tesseract-ocr-chi-sim tesseract-ocr-eng
          sudo cp deploy/fonts.conf /etc/fonts/local.conf
          sudo fc-cache -f

      - name: 安装 Python 依赖
        run: pip install -r requirements.txt

      - name: 编译检查
        run: python -m compileall -q app tests

      - name: 单元与集成测试
        working-directory: tests
        run: python -m unittest -v test_core test_api test_regressions test_tools test_research test_pipeline

  e2e:
    name: 浏览器端到端测试
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DW_SANDBOX: rlimit
      SAL_USE_VCLPLUGIN: svp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装系统组件
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libreoffice-core libreoffice-writer libreoffice-calc libreoffice-impress libreoffice-draw libreoffice-math \
            python3-uno \
            fonts-noto-cjk fonts-liberation2 fonts-crosextra-carlito fonts-crosextra-caladea fonts-dejavu-core fontconfig \
            ghostscript qpdf pandoc
          sudo cp deploy/fonts.conf /etc/fonts/local.conf
          sudo fc-cache -f

      - name: 安装 Python 依赖与 Playwright
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium

      - name: 运行端到端测试
        run: tests/run_e2e.sh "$RUNNER_TEMP/e2e_shots"

      - name: 上传截图和日志
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e_shots
          retention-days: 7

  docker:
    name: Docker 镜像构建与冒烟测试
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # 构建镜像并加载到本机 Docker；层缓存放在 GitHub Actions 缓存里，Dockerfile 不变时第二次只需几十秒
      - name: 构建镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: docwork:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 准备 .env 与数据目录
        run: |
          cp .env.example .env
          sed -i "s/^DW_MASTER_KEY=.*/DW_MASTER_KEY=$(openssl rand -hex 32)/" .env
          sed -i "s#^DW_PUBLIC_URL=.*#DW_PUBLIC_URL=http://127.0.0.1:8000#" .env
          mkdir -p data && sudo chown 1000:1000 data

      - name: 环境自检与创建管理员
        run: |
          docker compose run --rm -T --no-deps web python -m app.cli check
          printf 'admin\npassword1234\npassword1234\n' | docker compose run --rm -T --no-deps web python -m app.cli create-owner

      - name: 启动全部服务
        run: docker compose up -d --no-build

      # 在同一镜像的一次性容器里跑冒烟脚本：登录、上传、两次转换（第二次应复用常驻 LibreOffice）、导入并生成预览
      - name: 冒烟测试
        run: |
          docker compose run --rm -T --no-deps -v "$PWD/tests/smoke_docker.py:/smoke.py:ro" web python /smoke.py http://web:8000

      - name: 检查常驻 LibreOffice 在只读无网络容器中正常工作
        run: |
          docker compose logs worker-heavy | tee heavy.log
          grep -q "常驻 LibreOffice 已启动" heavy.log || { echo "::error::常驻 LibreOffice 没有启动"; exit 1; }
          if grep -q "改用冷启动" heavy.log; then echo "::error::常驻 LibreOffice 发生过回退"; exit 1; fi
          docker compose ps

      - name: 输出各服务日志
        if: failure()
        run: docker compose logs

      - name: 停止服务
        if: always()
        run: docker compose down -v --remove-orphans
